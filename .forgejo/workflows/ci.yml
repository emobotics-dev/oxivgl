# SPDX-License-Identifier: MIT OR Apache-2.0
# CI for oxivgl on the self-hosted Forgejo instance. Two kinds of leg:
#   host      — unit, doc, integration, pool, leak, doc-audit, screenshots on
#               x86_64 (headless SDL2)
#   firmware     — cross-compile examples for both m5stack boards (ESP32 + ESP32-S3)
#   firmware-s31 — lib build for RISC-V ESP32-S31 (Korvo-1); no m5stack BSP here
#
# Runs inside registry:3000/emobotics/oxivgl/oxivgl-ci:v3 — oxivgl's own CI image,
# built ON TOP of m5stack-core-ci (the org's reference ESP-BSP image) by
# build-ci-image.yml. Reusing that base gives the dual-board `esp` toolchain,
# LVGL/bindgen deps, Node 22 and coverage tools, plus the exported ESP cross-build
# env so the firmware legs need no plumbing; oxivgl-ci bakes on the three host
# extras (nightly, SDL2, a native libclang, riscv32-esp-elf). Everything is
# baked at image-build time — no job installs anything at runtime
# (conventions/containers.md §1). Bump the `:vN` tag here and in
# build-ci-image.yml together when the Dockerfile changes.
#
# Self-hosted `rust`/`esp32` runners: the image is pulled anonymously from the
# Forgejo registry (no credentials block), and the m5stack-core / esp-hal git
# deps are public GitHub forks that fetch anonymously.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # NO base-branch filter. A `pull_request:` list filters on the BASE branch,
    # and a base this list does not name means the build is never triggered at
    # all — no failing check, no pending check, nothing on the PR to notice.
    # Stacking (conventions/git-workflow.md §7) makes any branch a potential
    # base, so an allow-list is a trap. Match every base instead.
    branches: ['**']
  workflow_dispatch:

# Cancel an in-flight run when a newer commit supersedes it. The self-hosted
# fleet is small, so don't spend it building stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_HOME: /opt/rustup
  CARGO_HOME: /opt/cargo
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # ── Host tests ───────────────────────────────────────────────────────────
  host:
    name: Host tests
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/oxivgl/oxivgl-ci:v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Env only — nightly, SDL2 and the native libclang are baked into the
      # image. The base ESP-BSP image exports an ESP-clang LIBCLANG_PATH and an
      # ESP newlib sysroot for the firmware legs; redirect both for the host
      # build: point at the native libclang the image put at /usr/lib64, and
      # clear the ESP sysroot (its Xtensa-only headers would make host clang die
      # on <bits/libc-header-start.h>). No installs here (containers.md §1).
      - name: Point host bindgen at the native toolchain
        run: |
          echo "LIBCLANG_PATH=/usr/lib64" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> "$GITHUB_ENV"

      - name: Verify the devcontainer uses CI's toolchain image
        run: |
          # The devcontainer copies its Xtensa toolchain from this image so a
          # green local build means something about CI. A stale tag silently
          # gives the developer a different rustc than CI runs.
          ci=$(grep -oP 'oxivgl-ci:\Kv[0-9]+' .forgejo/workflows/ci.yml | sort -u)
          dev=$(grep -oP 'oxivgl-ci:\Kv[0-9]+' .devcontainer/Dockerfile | sort -u)
          if [ -z "$ci" ] || [ -z "$dev" ]; then
            echo "Could not read both image tags (ci='$ci' dev='$dev') — fix this check."
            exit 1
          fi
          if [ "$(echo "$ci" | wc -l)" -ne 1 ]; then
            echo "ci.yml names more than one oxivgl-ci tag:"; echo "$ci"; exit 1
          fi
          if [ "$ci" != "$dev" ]; then
            echo "devcontainer toolchain image is stale:"
            echo "  .forgejo/workflows/ci.yml  $ci"
            echo "  .devcontainer/Dockerfile   $dev"
            exit 1
          fi
          echo "devcontainer and CI share oxivgl-ci:$ci"

      - name: Verify the m5stack-core pin is not forked
        run: |
          # examples/common is `exclude`d from the workspace, so it cannot
          # inherit a [workspace.dependencies] entry and must repeat the pin.
          # Two different revs resolve to two separate m5stack_core crates:
          # one BSP compiled twice, with divergent layouts in a single image.
          # It surfaced once as `error[E0659]: m5stack_core is ambiguous`, but
          # a drift that does not collide by name would pass silently.
          # Matches either form: `rev` for a release, `branch` while tracking a
          # release candidate. A branch pin is not reproducible and must become
          # a rev before release; this check only enforces that the two agree.
          pin() { grep -oP '^m5stack-core = .*?\b(rev|branch) = "\K[^"]+' "$1"; }
          root=$(pin Cargo.toml)
          common=$(pin examples/common/Cargo.toml)
          if [ -z "$root" ] || [ -z "$common" ]; then
            echo "Could not read both m5stack-core pins (root='$root' common='$common')."
            echo "The grep, not the pin, is probably what broke — fix this check."
            exit 1
          fi
          if [ "$root" != "$common" ]; then
            echo "m5stack-core pin is forked:"
            echo "  Cargo.toml                 $root"
            echo "  examples/common/Cargo.toml $common"
            echo "Both must name the same rev or branch."
            exit 1
          fi
          echo "m5stack-core pin matches in both manifests: $root"

      - name: Enforce example safety (no unsafe, no oxivgl_sys)
        run: |
          # Pre-existing exceptions (to be fixed incrementally):
          EXEMPT="examples/anim4.rs|examples/animimg_1.rs|examples/widget_label4.rs|examples/widget_roller3.rs"
          FAIL=0
          if grep -rn 'unsafe \|unsafe{' examples/*.rs | grep -v '^examples/common/' | grep -Ev "$EXEMPT"; then
            echo "::error::Examples must not contain 'unsafe'. Use safe wrapper APIs."
            FAIL=1
          fi
          if grep -rn 'use oxivgl_sys' examples/*.rs | grep -v '^examples/common/' | grep -Ev "$EXEMPT"; then
            echo "::error::Examples must not import oxivgl_sys. Use oxivgl wrapper APIs."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All examples are safe — no unsafe, no oxivgl_sys (4 legacy exemptions)."

      - name: Unit tests
        run: cargo +nightly test --target x86_64-unknown-linux-gnu --lib

      - name: Doc tests
        run: cargo +nightly test --target x86_64-unknown-linux-gnu --doc

      - name: Integration tests (headless SDL2)
        run: |
          SDL_VIDEODRIVER=dummy cargo +nightly test --test integration \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

      - name: Memory pool tests
        run: |
          SDL_VIDEODRIVER=dummy cargo +nightly test --test mem_pool \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

      # Was never in CI, which is how leak_check.rs came to stop compiling on
      # master unnoticed. Covers both heaps — Rust via a counting allocator,
      # LVGL's own via lv_mem_monitor — so a wrapper that stops deleting its
      # lv_obj fails here. Asserts an exact zero: no noise floor on either heap.
      - name: Leak detection tests
        run: |
          SDL_VIDEODRIVER=dummy cargo +nightly test --test leak_check \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

      # The default legs never compile `oxivgl::demo`. Linking the example is
      # the point: an unreferenced undefined symbol does not fail `cargo check`.
      - name: Benchmark demo (alternate lv_conf.h)
        run: |
          export DEP_LV_CONFIG_PATH="$PWD/examples/conf-benchmark"
          export CARGO_TARGET_DIR="$PWD/target/benchmark"
          cargo +nightly test --target x86_64-unknown-linux-gnu --lib demo::
          cargo +nightly build --target x86_64-unknown-linux-gnu \
            --features demo-benchmark --example demo_benchmark
          # The doc audit below runs under the default configuration, where
          # oxivgl::demo does not exist — so its docs are audited here or
          # nowhere. run_docs.sh reads DEP_LV_CONFIG_PATH from the environment.
          ./run_docs.sh --check

      # Catches undocumented public items *and* doc-build failures. A broken
      # intra-doc link produces no HTML at all, which previously shipped a
      # module missing from docs.rs without failing anything.
      - name: Doc coverage and link check
        run: ./run_docs.sh --check

      - name: Run all examples (headless screenshots)
        run: ./run_host.sh -s

      # Coverage as an informational gate: `cargo llvm-cov` plus nightly
      # llvm-tools-preview, both baked into the image. No public badge — the
      # GitHub-gist badge action isn't mirrored on data.forgejo.org — but the
      # step still fails if coverage tooling breaks, and prints the percentage.
      - name: Measure coverage (unit + integration)
        run: |
          SDL_VIDEODRIVER=dummy cargo +nightly llvm-cov \
            --target x86_64-unknown-linux-gnu \
            --json --output-path coverage.json \
            -- --test-threads=1 --nocapture
          PCT=$(python3 -c "
          import json
          d = json.load(open('coverage.json'))
          t = d['data'][0]['totals']['lines']
          print(f\"{t['percent']:.0f}\")
          ")
          echo "Line coverage: ${PCT}%"

  # ── Firmware (both boards) ─────────────────────────────────────────────────
  # One matrix arm per board. Both build through the m5stack-core BSP; the
  # `fire27`/`cores3` feature selects the chip across the whole esp-hal family
  # (redirected to the emobotics fork via the workspace [patch]), the BSP board,
  # and oxivgl's chip feature. No ESP plumbing step: oxivgl-ci inherits the base
  # image's exported PATH / LIBCLANG_PATH / BINDGEN_EXTRA_CLANG_ARGS for Xtensa.
  firmware:
    name: Build (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: fire27
            target: xtensa-esp32-none-elf
          - board: cores3
            target: xtensa-esp32s3-none-elf
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/oxivgl/oxivgl-ci:v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build example getting_started1 (${{ matrix.board }})
        run: cargo +esp -Zbuild-std=alloc,core build --target ${{ matrix.target }} --release --features ${{ matrix.board }} --example getting_started1

      - name: Build example touch_setpoint (${{ matrix.board }})
        # Cross-checks the input-device code paths (KeypadIndev/PointerIndev,
        # with_repeat) and the example's no_std path on Xtensa.
        run: cargo +esp -Zbuild-std=alloc,core build --target ${{ matrix.target }} --release --features ${{ matrix.board }} --example touch_setpoint

      - name: Build example demo_benchmark (${{ matrix.board }})
        # The only leg compiling LVGL's demos for a target. Every other builds
        # the host config, whose primary satisfies the demos' LV_MEM_SIZE
        # guards alone — so a guard defect passes them all.
        run: |
          DEP_LV_CONFIG_PATH="$PWD/examples/conf-benchmark" \
          CARGO_TARGET_DIR="$PWD/target/benchmark" \
          cargo +esp -Zbuild-std=alloc,core build --target ${{ matrix.target }} \
            --release --features ${{ matrix.board }},demo-benchmark \
            --example demo_benchmark

  # RISC-V ESP32-S31. Stock nightly + build-std (rust-src is baked); not
  # `cargo +esp` (Xtensa). C compile: riscv32-esp-elf-gcc (newlib, baked).
  # Bindgen: native libclang + that GCC's sysroot. Clear the image's Xtensa
  # BINDGEN_EXTRA_CLANG_ARGS. Library only.
  firmware-s31:
    name: Build (s31)
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/oxivgl/oxivgl-ci:v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point RISC-V bindgen at native libclang, drop Xtensa sysroot
        run: |
          echo "LIBCLANG_PATH=/usr/lib64" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> "$GITHUB_ENV"
          echo "CC_riscv32imafc-unknown-none-elf=riscv32-esp-elf-gcc" >> "$GITHUB_ENV"
          command -v riscv32-esp-elf-gcc

      - name: Build oxivgl for esp32s31
        run: cargo +nightly -Zbuild-std=core,alloc build --target riscv32imafc-unknown-none-elf --release --no-default-features --features log-04,rtos-sem

  # Aggregate gate: one context that summarises every leg. `if: always()` so a
  # skipped/failed leg is judged here rather than reporting nothing. Point any
  # future branch protection at this single "CI passed" context.
  ci-passed:
    name: CI passed
    if: always()
    needs: [host, firmware, firmware-s31]
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/oxivgl/oxivgl-ci:v3
    steps:
      - name: Verify every leg succeeded
        env:
          HOST_RESULT: ${{ needs.host.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          FIRMWARE_S31_RESULT: ${{ needs.firmware-s31.result }}
        run: |
          set -eu
          rc=0
          for entry in "host=$HOST_RESULT" "firmware=$FIRMWARE_RESULT" "firmware-s31=$FIRMWARE_S31_RESULT"; do
            leg=${entry%%=*}
            result=${entry#*=}
            printf '%-10s %s\n' "$leg" "$result"
            [ "$result" = success ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::at least one CI leg did not succeed"
            exit 1
          fi
          echo "all legs succeeded"
