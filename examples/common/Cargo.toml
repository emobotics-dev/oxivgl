# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "oxivgl-examples-common"
edition = "2024"
publish = false

# --- Host (non-xtensa) dependencies ---
[target.'cfg(not(target_arch = "xtensa"))'.dependencies]
oxivgl = { path = "../..", features = ["log-04", "png"] }
oxivgl_sys = { package = "oxivgl-sys", path = "../../oxivgl-sys", default-features = false }
log = "0.4"
env_logger = "0.11"
critical-section = { version = "1", features = ["std"] }
heapless = { version = "0.8" }

# --- Board selection (xtensa) ---
# Exactly one board feature drives the chip across every esp crate, the
# m5stack-core BSP's board feature, and oxivgl's own chip feature. The harness
# then bring-ups the board through the BSP (see src/board.rs), so the two boards
# share one code path — CoreS3 differs only in touch-vs-keypad input and the
# I2C power/reset sequence, both handled by the BSP.
[features]
fire27 = [
    "oxivgl/esp32", "oxivgl/rtos-sem", "esp-rtos/esp-radio", "esp-rtos/esp-alloc",
    "esp-hal/esp32", "esp-rtos/esp32", "esp-bootloader-esp-idf/esp32", "esp-sync/esp32",
    "m5stack-core/fire27", "m5stack-core/buttons",
]
# Measurement apparatus for the threaded pipeline: a 10 ms latency probe and a
# once-a-second stats line. Off by default so only a build being measured pays.
perf-probe = []

cores3 = [
    "oxivgl/esp32s3", "oxivgl/rtos-sem", "esp-rtos/esp-radio", "esp-rtos/esp-alloc",
    "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-rtos/log-04",
    "esp-bootloader-esp-idf/esp32s3", "esp-sync/esp32s3", "esp-sync/log-04",
    "embassy-executor/log", "embassy-time/log",
    "m5stack-core/cores3",
]

# --- ESP32 / ESP32-S3 (xtensa) dependencies ---
# Chip features are supplied by the active board feature above, never hardcoded.
# The esp-hal family resolves to the emobotics fork via the workspace-root
# [patch.crates-io] (the BSP's DMA display flush needs its SPI/DMA fixes).
[target.'cfg(target_arch = "xtensa")'.dependencies]
oxivgl = { path = "../..", default-features = false, features = ["esp-hal", "log-04"] }
oxivgl_sys = { package = "oxivgl-sys", path = "../../oxivgl-sys", default-features = false }
# Keep the tag in sync with the root Cargo.toml pin. `identity` is what makes
# the board name its own image at boot; see build.rs for the required wiring.
# MUST be byte-identical to the `rev` in the root Cargo.toml. This package is
# `exclude`d from the workspace, so it cannot inherit a `[workspace.dependencies]`
# entry and the pin is duplicated by necessity. Two different revs resolve to two
# separate `m5stack_core` crates, which fails as `error[E0659]: m5stack_core is
# ambiguous` — and, worse, would be two BSPs with divergent layouts in one image
# if the name never collided. CI asserts the two revs match; see the
# "Verify the m5stack-core pin is not forked" step in .forgejo/workflows/ci.yml.
m5stack-core = { git = "http://forgejo:3000/emobotics/m5stack-core.git", rev = "14c9f8a7d9d55d3fbd5359782c26836eac8e6fad", default-features = false, features = ["display", "psram", "console-serial", "panic-handler", "identity"] }
esp-bootloader-esp-idf = { version = "0.6.0" }
esp-hal              = { version = "1.2", features = ["unstable"] }
esp-rtos             = { version = "0.4.0", features = ["embassy"] }
# Thread creation for the threaded render pipeline (see src/sched.rs). Scheduler
# *interface* crate — the registration comes from esp-rtos, above.
esp-radio-rtos-driver = { version = "0.4.0" }
esp-sync             = { version = "0.3.0" }
embassy-embedded-hal = { version = "0.6.0", features = ["time"] }
embassy-executor     = { version = "0.10.0", features = ["nightly"] }
embassy-sync         = "0.8"
embassy-time         = "0.5.0"
lcd-async            = "0.1.1"
log                  = "0.4"
static_cell          = { version = "2.1.1", features = ["nightly"] }

# Zero-warnings policy: any rustc warning is a hard build error.
# Equivalent to `-D warnings`, scoped to this crate's own code.
[lints.rust]
warnings = "deny"
